services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: yp
      DOCKER_INFLUXDB_INIT_PASSWORD: yp-ground-station
      DOCKER_INFLUXDB_INIT_ORG: yp
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: yp-dev-token
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  yp-server:
    build:
      context: .
      dockerfile: services/server/Dockerfile
      network: host
    ports:
      - "8000:8000"
      # MAVLink UDP ingress from external radios / BlueOS endpoints
      - "14550:14550/udp"
      - "14551:14551/udp"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: yp
      INFLUX_BUCKET: telemetry
      INFLUX_TOKEN: yp-dev-token
      AUTH_DB_PATH: /data/auth/auth.db
      TILE_DIR: /data/tiles
      TILE_CACHE_DIR: /data/tile-cache
      OSM_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      OSM_USER_AGENT: YPGroundStation/0.1
      OSM_REFERER: http://localhost:8080/
      EARTH_TILE_URL: https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      EARTH_USER_AGENT: YPGroundStation/0.1
      EARTH_REFERER: http://localhost:8080/
      VEHICLE_TTL_SECONDS: "30"
      MESSAGE_RETENTION_SECONDS: "600"
      MESSAGE_CLEANUP_INTERVAL_SECONDS: "600"
      INFLUX_MAX_WRITE_HZ: "5"
      TILE_MAX_CACHE_AGE_SECONDS: "31536000"
    volumes:
      - ./data/auth:/data/auth
      - ./data/tiles:/data/tiles:ro
      - ./data/tile-cache:/data/tile-cache
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    # Recommended: connect an RFD-900 telemetry radio or RTK base station
    # (e.g. u-blox / Here+) via `python services/com_tcp_relay.py --port <port>
    # --tcp-port <n>` on the host, then pick "TCP" as the source in the browser
    # UI (Connections panel / Settings -> RTK Correction) using
    # tcp:host.docker.internal:<n>. This works identically on Windows, Linux,
    # and macOS and needs no compose edits or container restarts to switch
    # ports/devices.
    #
    # Alternative (Linux hosts only): pass the USB device straight through
    # instead of using the relay. Requires editing this file and recreating
    # the container whenever the device path changes.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  web:
    build:
      context: ./web
      network: host
    ports:
      - "8080:80"
    depends_on:
      yp-server:
        condition: service_healthy

  yp-gps:
    build:
      context: ./services/yp_gps
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      GPS_MODE: sim
      VEHICLE_ID: YP689
      HOME_LAT: "38.989639"
      HOME_LON: "-76.478643"
      HOME_ALT: "2.0"
      HEADING_DEG: "330"
      SPEED_KNOTS: "3"
      SEND_HZ: "5"
      CIRCLE_LEFT_LON: "-76.487031"
      CIRCLE_RIGHT_LON: "-76.479393"
      CIRCLE_CW: "true"
      SERIAL_PORT: /dev/ttyUSB0
      BAUD_RATE: "9600"
    depends_on:
      yp-server:
        condition: service_healthy
    # For a real serial GPS, switch GPS_MODE to serial and uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  sim-uav1:
    build:
      context: ./services/sim_vehicle
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      VEHICLE_TYPE: uav
      VEHICLE_ID: sim-uav1
      HOME_LAT: "38.984250"
      HOME_LON: "-76.508618"
      HOME_ALT: "45.0"
      SPAWN_JITTER_DEG: "0.0002"
      TARGET_JITTER_DEG: "0.0011"
      SEND_HZ: "5"
    depends_on:
      yp-server:
        condition: service_healthy

  sim-uav2:
    build:
      context: ./services/sim_vehicle
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      VEHICLE_TYPE: uav
      VEHICLE_ID: sim-uav2
      HOME_LAT: "38.989639"
      HOME_LON: "-76.483322"
      HOME_ALT: "45.0"
      SPAWN_JITTER_DEG: "0.0003"
      TARGET_JITTER_DEG: "0.0010"
      SEND_HZ: "5"
    depends_on:
      yp-server:
        condition: service_healthy

  sim-usv:
    build:
      context: ./services/sim_vehicle
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      VEHICLE_TYPE: usv
      VEHICLE_ID: sim-usv
      HOME_LAT: "38.989639"
      HOME_LON: "-76.483322"
      HOME_ALT: "0.0"
      SPAWN_JITTER_DEG: "0.0003"
      TARGET_JITTER_DEG: "0.0010"
      SEND_HZ: "5"
    depends_on:
      yp-server:
        condition: service_healthy

  sim-uuv:
    build:
      context: ./services/sim_vehicle
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      VEHICLE_TYPE: uuv
      VEHICLE_ID: sim-uuv
      HOME_LAT: "38.989639"
      HOME_LON: "-76.483322"
      HOME_ALT: "-6.0"
      SPAWN_JITTER_DEG: "0.0003"
      TARGET_JITTER_DEG: "0.0010"
      SEND_HZ: "5"
    depends_on:
      yp-server:
        condition: service_healthy

  sim-umaa:
    build:
      context: ./services/umaa_bridge
      network: host
    environment:
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      VEHICLE_ID: sim-umaa
      VEHICLE_TYPE: usv
      SEND_HZ: "5"
      UMAA_BACKEND: loopback
    depends_on:
      yp-server:
        condition: service_healthy

  px4-sitl-uav:
    profiles: ["px4"]
    build:
      context: ./services/px4_sitl
    environment:
      PX4_HOME_LAT: "38.98490"
      PX4_HOME_LON: "-76.47880"
      PX4_HOME_ALT: "45.0"
      PX4_SYS_AUTOSTART: "4001"
      PX4_SIM_MODEL: gz_x500
      PX4_GZ_MODEL: gz_x500
      HEADLESS: "1"
    ports:
      - "14580:14580/udp"
      - "18570:18570/udp"
    depends_on:
      yp-server:
        condition: service_healthy

  ros-master:
    profiles: ["px4"]
    image: ros:noetic-ros-core-focal
    command: roscore

  mavros:
    profiles: ["px4"]
    build:
      context: ./services/mavros
    environment:
      ROS_MASTER_URI: http://ros-master:11311
      ROS_HOSTNAME: mavros
    command: >
      bash -lc "source /opt/ros/noetic/setup.bash &&
      until rostopic list >/dev/null 2>&1; do sleep 1; done &&
      roslaunch mavros px4.launch
      fcu_url:=udp://:14540@px4-sitl-uav:14580
      gcs_url:=udp://@yp-server:14550
      tgt_system:=1
      tgt_component:=1"
    depends_on:
      - ros-master
      - px4-sitl-uav

  rosbridge:
    profiles: ["px4"]
    build:
      context: ./services/mavros
    environment:
      ROS_MASTER_URI: http://ros-master:11311
      ROS_HOSTNAME: rosbridge
    command: >
      bash -lc "source /opt/ros/noetic/setup.bash &&
      until rostopic list >/dev/null 2>&1; do sleep 1; done &&
      roslaunch rosbridge_server rosbridge_websocket.launch port:=9090"
    ports:
      - "9090:9090"
    depends_on:
      - ros-master
      - mavros

  px4-yp-bridge:
    profiles: ["px4"]
    build:
      context: ./services/px4_mavros_bridge
    environment:
      VEHICLE_ID: px4-uav
      VEHICLE_TYPE: uav
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      ROSBRIDGE_URL: ws://rosbridge:9090
      SETPOINT_HZ: "5"
      AUTO_ARM_OFFBOARD: "true"
      GLOBAL_SETPOINT_FRAME: "6"
      DISCOVER_MAVROS_TOPICS: "true"
    depends_on:
      - yp-server
      - rosbridge

  arducopter-bridge:
    profiles: ["arducopter"]
    build:
      context: .
      dockerfile: services/arducopter_ws_bridge/Dockerfile
    environment:
      VEHICLE_ID: arducopter-uav
      VEHICLE_TYPE: uav
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      MAVLINK_URL: udpin:0.0.0.0:14600
      SEND_HZ: "5"
    # Connect external ArduPilot SITL or hardware MAVLink output to this port.
    ports:
      - "14600:14600/udp"
    depends_on:
      - yp-server

  umaa-bridge:
    profiles: ["umaa-real"]
    build:
      context: ./services/umaa_bridge
    environment:
      VEHICLE_ID: umaa-01
      VEHICLE_TYPE: usv
      SERVER_WS_URL: ws://yp-server:8000/ws/vehicle
      SEND_HZ: "5"
      UMAA_BACKEND: rti
      RTI_DOMAIN_ID: "1"
      RTI_QOS_FILE: ""
      RTI_SOURCE_GUID: ""
      RTI_COMMAND_TOPIC: ""
      RTI_ACK_TOPIC: ""
      RTI_STATUS_TOPIC: ""
      RTI_NAVSATFIX_TOPIC: ""
      RTI_BATTERY_TOPIC: ""
      RTI_HEARTBEAT_TOPIC: ""
    depends_on:
      - yp-server

volumes:
  influx-data:
