server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://yp-server:8000/api/;
  }

  # MJPEG camera streams are long-lived and must not be buffered/chunked by nginx.
  location ~ ^/api/cameras/[^/]+/stream\.mjpg$ {
    proxy_pass http://yp-server:8000;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /tiles/ {
    proxy_pass http://yp-server:8000/tiles/;
  }

  location /ws/ {
    proxy_pass http://yp-server:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
