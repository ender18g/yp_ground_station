server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://yp-server:8000/api/;
  }

  location /tiles/ {
    proxy_pass http://yp-server:8000/tiles/;
  }

  location /local-map/ {
    set $tileserver http://tileserver:8080;
    proxy_pass $tileserver/;
  }

  location /ws/ {
    proxy_pass http://yp-server:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
